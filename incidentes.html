<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos incidentes</title>
    <link rel="stylesheet" href="incidentesP1.css">
    <link rel="stylesheet" href="incidentes.css">

</head>
<body>
    <header>
        <h2>Treinamento ServiceNow</h2>
        <span id="conectado"></span>
        <a class="volta" href="painel.html">Voltar para o painel</a>
        <button onclick="sair()">Sair</button>
    </header>

    <main>
        <h1>TODOS INCIDENTES</h1>

        <label for="estado">Estado</label>
        <select id="estado">
            <option value="">Todos</option>
            <option value="1">New</option>
            <option value="2">In Progress</option>
            <option value="3">On Hold</option>
            <option value="6">Resolved</option>
            <option value="7">Closed</option>
        </select>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
            <option value="">Todas</option>
            <option value="1">1 - Critical</option>
            <option value="2">2 - High</option>
            <option value="3">3 - Moderate</option>
            <option value="4">4 - Low</option>
        </select>

        <label for="busca">Buscar</label>
        <input id="busca" type="text" placeholder="Número (INC000...) ou trecho da descrição">

        <button onclick="filtrar()">Filtrar</button>
        <p id="mensagem">Carregando...</p>

        <table id="tabela">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Descrição</th>
                    <th>Prioridade</th>
                    <th>Estado</th>
                    <th>Grupo</th>
                    <th>Aberto em</th>
                </tr>
            </thead>
            <tbody id="corpo"></tbody>
        </table>

        <button id="anterior" onclick="paginaAnterior()">Anterior</button>
        <span id="numero-pagina"></span>
        <button id="proxima" onclick="proximaPagina()">Próxima</button>
    </main>

    <div id="modal-fundo" class="modal-fundo fundo">
        <div class="modal-caixa">
            <div class="modal-topo">
                 <span id="modal-numero"></span>
                <button onclick="fecharModal()">Fechar</button>
            </div>

            <h2 id="modal-titulo"></h2>
            <p><strong>Solicitante:</strong> <span id="modal-solicitante"></span></p>
            <p><strong>Categoria:</strong> <span id="modal-categoria"></span></p>
            <p><strong>Grupo designado:</strong> <span id="modal-grupo"></span></p>
            <p><strong>Impacto:</strong> <span id="modal-impacto"></span></p>
            <p><strong>Urgência:</strong> <span id="modal-urgencia"></span></p>
            <p><strong>Prioridade:</strong> <span id="modal-prioridade"></span></p>
            <p><strong>Responsável:</strong> <span id="modal-responsavel"></span></p>
            <p><strong>Estado:</strong> <span id="modal-estado"></span></p>
            <p><strong>Aberto em:</strong> <span id="modal-aberto"></span></p>
            <p><strong>Atualizado em:</strong> <span id="modal-atualizado"></span></p>

            <p><strong>Descrição completa:</strong></p>
            <p id="modal-descricao"></p>
        </div>
    </div>

    <script src="incidentes.js"></script>
</body>
</html>
