<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <link rel="stylesheet" href="painel.css">

</head>
<body>

    <header>
        <h2>Treinamento ServiceNow</h2>
        <span id="conectado"></span>
        <button onclick="sair()">Sair</button>
    </header>
    <main>
        <h1>PAINEL INICIAL</h1>
        <div class="cards">
            <div class="card">
                <h3>Todos incidentes</h3>
                <p id="todos">Carregando...</p>
                <a class="ver-lista" href="incidentes.html">Ver lista</a>
            </div>

            <div class="card">
                <h3>Incidentes ativos</h3>
                <p id="ativos">Carregando...</p>
            </div>

            <div class="card">
                <h3>Incidentes P1</h3>
                <p id="p1">Carregando...</p>
                <a class="ver-lista" href="incidentesP1.html">Ver lista</a>
            </div>
            
            <div class="card">
                <h3>Mudanças agendadas</h3>
                <p id="agendadas">Carregando...</p>
            </div>
        </div>

        <div class="atalhos">
            <a class="botao botao-cheio" href="novoIncidente.html">+ Novo incidente</a>
            <a class="botao botao-contorno" href="#">+ Nova mudança</a>
        </div>
    </main>

    <script src="painel.js"></script>

</body>
</html>
